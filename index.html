<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%91%3C/text%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#f6ead6" />
    <title>Guac-a-Mole</title>
    <meta name="description" content="Whack the avocados. Make the guacamole. A 60-second browser game built with React, Vite and Three.js." />
    <link rel="canonical" href="https://guac-a-mole.vercel.app/" />

    <!--
      Link previews. Social crawlers (LinkedIn, Slack, WhatsApp, X) do not run
      JavaScript, so these tags have to be static in the HTML shell rather than
      set from React. Every URL is absolute: relative paths are not resolved
      reliably by crawlers.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guac-a-Mole" />
    <meta property="og:url" content="https://guac-a-mole.vercel.app/" />
    <meta property="og:title" content="Guac-a-Mole" />
    <meta property="og:description" content="Whack the avocados. Make the guacamole. A 60-second browser game built with React, Vite and Three.js." />
    <meta property="og:image" content="https://guac-a-mole.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://guac-a-mole.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A wooden chopping board with nine holes, avocados popping out of it and a bowl of guacamole beside it." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guac-a-Mole" />
    <meta name="twitter:description" content="Whack the avocados. Make the guacamole. A 60-second browser game built with React, Vite and Three.js." />
    <meta name="twitter:image" content="https://guac-a-mole.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="A wooden chopping board with nine holes, avocados popping out of it and a bowl of guacamole beside it." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
